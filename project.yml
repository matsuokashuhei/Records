name: Records
options:
  bundleIdPrefix: com.cacheandbuffer
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
# Sparkle 2 (アップデート機構)。リリースの安定性のため exact version で固定。
# 上げるときは .github/workflows/release.yml のツールダウンロードも同じ版に
# 合わせること(generate_appcastの出力互換のため)
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.10.1
settings:
  base:
    DEVELOPMENT_TEAM: CY4LJR5KMM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Records:
    type: application
    platform: macOS
    sources:
      # Info.plistは部分plist(生成キーにマージされる)なので
      # リソースとしてコピーされないよう除外する
      - path: Records
        excludes:
          - Info.plist
      - Shared
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheandbuffer.Records
        PRODUCT_NAME: Records
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Records/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Records
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Used to fetch albums and playlists from the Apple Music catalog and play them.
  RecordsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RecordsTests
      # テスト対象の純ロジックだけ取り込む(アプリ本体をホストにしない)
      - Shared/MediaEntry.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheandbuffer.Records.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Records:
    build:
      targets:
        Records: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecordsTests
